name: C/C++ CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - cc: gcc
            cxx: g++
            slim_check_nd: "yes"
          - cc: clang
            cxx: clang++
            slim_check_nd: "yes"
    env:
      DEBUG_FLAG: ${{ matrix.debug_flag }}
      slim_CHECK_ND: ${{ matrix.slim_check_nd }}
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LMNTAL_HOME: ${{ github.workspace }}/lmntal-compiler
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Check if this is an auto-commit
        id: check_bot
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"chore: update VERSION hash"* ]]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

      - run: sudo apt -qq update
        if: steps.check_bot.outputs.is_bot == 'false'
      - run: sudo apt install -y ant re2c cmake build-essential bison ruby
        if: steps.check_bot.outputs.is_bot == 'false'
      - run: git clone https://github.com/lmntal/lmntal-compiler.git
        if: steps.check_bot.outputs.is_bot == 'false'
      - run: cd lmntal-compiler && ant && cd ..
        if: steps.check_bot.outputs.is_bot == 'false'
      - run: ./build-cmake.sh
        if: steps.check_bot.outputs.is_bot == 'false'
      - run: ./run-tests.sh --output-on-failure
        if: steps.check_bot.outputs.is_bot == 'false'

      - name: Write commit hash to VERSION and push
        if: steps.check_bot.outputs.is_bot == 'false' && matrix.cc == 'gcc'
        run: |
          LINE1=$(head -1 VERSION)
          printf '%s\n%s\n' "$LINE1" "${GITHUB_SHA:0:8}" > VERSION
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update VERSION hash" && git push)
